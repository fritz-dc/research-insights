<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Classroom Compass</title>
<link rel="icon" type="image/png" href="__FAVICON__">
<style>

/* ══ 1 · DESIGN TOKENS ════════════════════════════════════════════════════════ */
:root {
  /* palette */
  --navy:    #2D00A0;
  --blue:    #1A6FB5;
  --teal:    #0D8C5E;
  --coral:   #C94C1F;
  --amber:   #9A6200;
  --pink:    #A83060;
  --purple:  #5B3FA6;
  --cyan:    #1A8FA6;
  --gray:    #6B6B6B;
  --lgray:   #E8E5DE;
  --offwhite:#F7F5F0;
  --white:   #FFFFFF;
  --body-font:  'Helvetica Neue', Arial, sans-serif;
  --prose-font: Georgia, 'Times New Roman', serif;
  /* semantic */
  --text:      #0D1B2A;
  --subtext:   #6B6B6B;
  --bg:        #F7F5F0;
  --surface:   #FFFFFF;
  --border:    #E8E5DE;
  --filter-bg: #EBF2FC;
}

/* dark mode — single data-theme swap, no JS per-property */
:root[data-theme="dark"] {
  --text:      #B8D2E8;
  --subtext:   #678099;
  --bg:        #07111D;
  --surface:   #0B1927;
  --border:    #173050;
  --filter-bg: #060F1C;
  --lgray:     #173050;
  --offwhite:  #07111D;
  --white:     #0B1927;
  --navy:      #1A0060;
  --gray:      #678099;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html  { scroll-behavior: smooth; }
body  { font-family: var(--body-font); background: var(--bg); color: var(--text);
        line-height: 1.5; transition: background 0.22s, color 0.22s; }
a     { color: inherit; }
button { font-family: var(--body-font); }

/* ══ 2 · HERO ═════════════════════════════════════════════════════════════════ */
.hero {
  background: var(--navy);
  padding: 1.25rem 2rem 1rem;
  position: sticky; top: 0; z-index: 200;
  transition: background 0.22s;
}
.hero-inner { max-width: 1200px; margin: 0 auto; }
.hero-top {
  display: flex; align-items: center; justify-content: space-between;
  gap: 1.5rem; margin-bottom: 0.75rem;
}
.hero-left  { display: flex; align-items: center; gap: 1rem; min-width: 0; }
.hero-logo  { height: 32px; width: auto; object-fit: contain; flex-shrink: 0; }
.hero-name  { font-size: 22px; font-weight: 700; color: #fff; letter-spacing: -0.01em;
               white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hero-sub   { font-size: 11px; color: rgba(255,255,255,0.45); margin-top: 1px; }
.hero-right { display: flex; align-items: center; gap: 1.25rem; flex-shrink: 0; }
.hero-chips { display: flex; gap: 1.5rem; padding-left: 1.25rem; border-left: 0.5px solid rgba(255,255,255,0.2); margin-left: 0.25rem; }
.hero-chip  { text-align: right; }
.chip-val   { display: block; font-size: 22px; font-weight: 700; color: #fff; line-height: 1; }
.chip-lbl   { display: block; font-size: 9px; color: rgba(255,255,255,0.4);
               text-transform: uppercase; letter-spacing: 0.1em; margin-top: 2px; }
.dark-btn {
  background: rgba(255,255,255,0.08); border: 0.5px solid rgba(255,255,255,0.15);
  border-radius: 50%; width: 30px; height: 30px; cursor: pointer;
  color: rgba(255,255,255,0.75); font-size: 14px; display: flex;
  align-items: center; justify-content: center; flex-shrink: 0;
  transition: background 0.14s;
}
.dark-btn:hover { background: rgba(255,255,255,0.16); }
.hero-context { border-top: 0.5px solid rgba(255,255,255,0.12); padding-top: 0.65rem; }
.hero-context-headline { font-size: 13px; font-weight: 600; color: rgba(255,255,255,0.9);
                         margin-bottom: 3px; line-height: 1.4; }
.hero-context-detail   { font-size: 11px; color: rgba(255,255,255,0.45); line-height: 1.5; }
.hero-context-detail span { color: rgba(255,255,255,0.65); }

/* ══ 3 · CONTROLS BAR ═════════════════════════════════════════════════════════ */
.controls-bar {
  background: var(--filter-bg);
  border-bottom: 2px solid var(--blue);
  padding: 0.6rem 2rem;
  position: sticky; top: 0; z-index: 190;  /* top offset set by JS after hero height known */
  transition: background 0.22s, border-color 0.22s;
}
.tabs-inner {
  max-width: 1200px; margin: 0 auto 0.6rem; padding-bottom: 0.6rem;
  display: flex; align-items: flex-start; gap: 1.25rem;
  border-bottom: 1.5px solid var(--blue);
}
.group-tabs { column-width: 148px; column-gap: 5px; flex: 1; }
.group-tab {
  display: block; width: 100%; margin-bottom: 5px; break-inside: avoid;
  padding: 3px 10px; font-size: 10px; font-weight: 400;
  border: 1px solid var(--border); border-radius: 8px;
  background: var(--surface); color: var(--subtext); cursor: pointer;
  transition: all 0.12s;
  text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.group-tab:hover  { border-color: var(--blue); color: var(--blue); }
.group-tab.active { background: var(--blue); border-color: var(--blue); color: #fff; }
.controls-inner {
  max-width: 1200px; margin: 0 auto;
  display: flex; align-items: flex-start; gap: 1.25rem; flex-wrap: wrap;
}
.controls-label {
  font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.12em;
  color: var(--subtext); white-space: nowrap; flex-shrink: 0; padding-top: 4px;
  min-width: 78px;
}
.filters { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0.75rem 1rem; flex: 1; align-items: start; }
.filter-group--wide { grid-column: 1 / -1; }
.section-toggle {
  display: inline-flex; align-items: center; gap: 5px;
  background: none; border: none; padding: 0; cursor: pointer;
  font-family: inherit;
}
.section-chevron { font-size: 8px; transition: transform 0.15s; display: inline-block; }
.tabs-inner.collapsed .group-tabs,
.controls-inner.collapsed .filters { display: none; }
.collapsed .section-chevron { transform: rotate(-90deg); }
@media (max-width: 760px) { .filters { grid-template-columns: 1fr; } }
.filter-group { display: flex; flex-direction: column; gap: 3px; }
.filter-label { font-size: 9px; text-transform: uppercase; letter-spacing: 0.12em;
                color: var(--blue); font-weight: 700; }
.filter-opts  { display: flex; gap: 3px; flex-wrap: wrap; }
.filter-chip {
  padding: 2px 8px; font-size: 10px; border: 0.5px solid var(--border);
  border-radius: 20px; background: var(--surface); color: var(--text);
  cursor: pointer; transition: all 0.12s;
}
.filter-chip:hover  { border-color: var(--blue); color: var(--blue); }
.filter-chip.active { background: var(--blue); border-color: var(--blue); color: #fff; }
.filter-opts[data-field="state"] {
  display: grid; grid-auto-flow: column;
  grid-template-rows: repeat(2, auto);
  grid-auto-columns: minmax(0, 1fr); gap: 3px;
}
.filter-opts[data-field="state"] .filter-chip { text-align: center; padding: 2px 4px; }
.search-btn {
  padding: 4px 12px; font-size: 10px; font-weight: 600; border: 0.5px solid var(--blue);
  border-radius: 4px; background: var(--blue); color: #fff;
  cursor: pointer; transition: all 0.12s; white-space: nowrap;
}
.search-btn:hover { filter: brightness(1.08); }
.reset-btn {
  padding: 4px 10px; font-size: 10px; border: 0.5px solid var(--border);
  border-radius: 4px; background: transparent; color: var(--subtext);
  cursor: pointer; align-self: flex-end; transition: all 0.12s;
}
.reset-btn:hover { border-color: var(--coral); color: var(--coral); }
.search-wrap {
  display: flex; flex-direction: column; align-items: flex-end; gap: 4px; margin-left: auto;
}
.search-icon  { font-size: 18px; color: var(--subtext); }
.search-input {
  font-family: var(--body-font); font-size: 11px; outline: none;
  border: 0.5px solid var(--border); border-radius: 4px;
  background: var(--surface); color: var(--text);
  padding: 4px 8px; width: 150px; transition: border-color 0.14s, width 0.2s;
}
.search-input:focus       { border-color: var(--blue); width: 210px; }
.search-input::placeholder { color: var(--subtext); }

/* ══ 4 · CARD GRID ════════════════════════════════════════════════════════════ */
#card-grid {
  max-width: 1200px; margin: 1.5rem auto 3rem; padding: 0 2rem;
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: 0.875rem; align-items: start;
}

/* ══ 5 · SUMMARY CARD ═════════════════════════════════════════════════════════ */
@keyframes tileIn {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: translateY(0);   }
}
.summary-card {
  background: var(--surface);
  border-radius: 7px;
  border: 0.5px solid var(--border);
  border-top: 3px solid var(--cat-color, var(--blue));
  overflow: hidden;
  cursor: pointer;
  opacity: 0; /* overridden immediately by animation */
  animation: tileIn 0.35s ease forwards;
  transition: box-shadow 0.18s, opacity 0.2s;
}
.summary-card:hover  { box-shadow: 0 3px 14px rgba(0,0,0,0.09); }
.summary-card.expanded { grid-column: 1 / -1; cursor: default; }
.summary-card.card--dimmed { opacity: 0.22 !important; pointer-events: none; }

.card-header {
  display: flex; justify-content: space-between; align-items: flex-start;
  padding: 11px 13px 5px;
}
.card-badges { display: flex; gap: 5px; align-items: center; flex-wrap: wrap; }
.cat-badge   { font-size: 9px; font-weight: 700; text-transform: uppercase;
               letter-spacing: 0.07em; color: var(--cat-color, var(--blue)); }
.section-badge { font-size: 9px; color: var(--subtext); background: var(--bg);
                 padding: 1px 5px; border-radius: 8px; }
.expand-btn {
  background: none; border: none; cursor: pointer; color: var(--subtext);
  padding: 0 0 0 8px; font-size: 11px; line-height: 1;
  transition: color 0.12s; flex-shrink: 0;
}
.expand-btn:hover { color: var(--text); }
.expand-icon { display: inline-block; transition: transform 0.25s; }
.summary-card.expanded .expand-icon { transform: rotate(180deg); }

.card-body { padding: 3px 13px 9px; }
.insight-title {
  font-size: 13px; font-weight: 600; line-height: 1.45;
  color: var(--text); margin-bottom: 7px;
}
.summary-card.expanded .insight-title { font-size: 16px; }
.signal-row { display: flex; align-items: center; gap: 5px; }
.sig-label  { font-size: 9px; color: var(--subtext); }
.sig-bar    { display: flex; gap: 2px; }
.sig-block  { width: 9px; height: 9px; border-radius: 1px; background: var(--border); }
.sig-block.filled { background: var(--cat-color, var(--blue)); }
.sig-pct    { font-size: 9px; color: var(--subtext); }

.card-footer {
  display: flex; padding: 7px 13px 11px; gap: 6px;
  border-top: 0.5px solid var(--bg);
}
.card-stat { flex: 1; text-align: center; min-width: 0; }
.stat-val  { display: block; font-size: 13px; font-weight: 700;
             color: var(--cat-color, var(--blue)); line-height: 1.2;
             white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat-lbl  { display: block; font-size: 8px; color: var(--subtext);
             text-transform: uppercase; letter-spacing: 0.06em; margin-top: 1px;
             white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ══ 6 · DETAIL PANEL ═════════════════════════════════════════════════════════ */
/* Height animates via JS (max-height transition), not display:none */
.detail-panel {
  border-top: 0.5px solid var(--border);
  background: var(--surface);
  overflow: hidden;
  max-height: 0;
}
.detail-inner { padding: 1.5rem 1.5rem 0; }
.detail-prose { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem 1.5rem; margin-bottom: 1.25rem; }
.prose-section { margin-bottom: 0; border-left: 3px solid var(--cat-color, var(--blue)); padding-left: 12px; }
@media (max-width: 760px) { .detail-prose { grid-template-columns: 1fr; } }
.prose-label {
  font-size: 13px; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.1em; color: var(--cat-color, var(--blue)); margin-bottom: 5px;
}
.prose-text {
  font-family: var(--body-font); font-size: 13px;
  line-height: 1.72; color: var(--text);
}

.charts-toggle {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 13px; font-size: 11px; font-weight: 600;
  color: var(--blue); background: var(--bg);
  border-radius: 4px; cursor: pointer; user-select: none;
  border: none; transition: background 0.12s; margin-bottom: 1rem;
}
.charts-toggle:hover { background: var(--border); }

.charts-panel { padding: 0 1.5rem 1rem; }
.charts-grid  {
  display: grid; grid-template-columns: repeat(2, 1fr);
  gap: 1rem; margin-bottom: 0.75rem;
}
.chart-item {
  background: var(--bg); border-radius: 5px; padding: 10px 12px;
  transition: opacity 0.22s ease;
}
.chart-title {
  font-size: 11px; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.12em; color: var(--subtext); margin-bottom: 7px;
}
.chart-wrap { position: relative; }

/* items table */
.items-table-wrap { margin-bottom: 0.75rem; }
.items-table { width: 100%; font-size: 11px; border-collapse: collapse; color: var(--text); }
.items-table th {
  text-align: left; font-size: 9px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.1em; color: var(--subtext);
  padding: 0 8px 5px 0; border-bottom: 0.5px solid var(--border);
}
.items-table th:last-child { text-align: right; }
.items-table td { padding: 4px 8px 4px 0; border-bottom: 0.5px solid var(--bg); }
.items-table td:last-child { text-align: right; color: var(--subtext);
                              font-variant-numeric: tabular-nums; }
.items-table tr:last-child td { border-bottom: none; }

/* state tile map */
.state-map-wrap { width: 100%; }

.chart-legend {
  display: flex; gap: 1.25rem; font-size: 10px;
  color: var(--subtext); align-items: center; flex-wrap: wrap;
}
.legend-item        { display: flex; align-items: center; gap: 5px; }
.legend-swatch      { width: 10px; height: 10px; border-radius: 2px;
                      background: var(--cat-color, var(--blue)); opacity: 0.65; }
.legend-tick        { width: 14px; height: 2.5px; background: rgba(0,0,0,0.55);
                      border-radius: 1px; }
.legend-delta-up    { font-size: 9px; font-weight: 700; color: var(--teal); }
.legend-delta-down  { font-size: 9px; font-weight: 700; color: var(--coral); }

/* detail footer */
.detail-footer {
  padding: 1rem 1.5rem 1.25rem;
  display: flex; justify-content: space-between;
  align-items: flex-end; gap: 1rem; flex-wrap: wrap;
  border-top: 0.5px solid var(--bg);
}
.trust-btn  { background: none; border: none; font-size: 10px;
              color: var(--subtext); cursor: pointer; padding: 0; }
.trust-btn:hover { color: var(--text); }
.trust-panel { margin-top: 8px; }
.trust-table { font-size: 10px; color: var(--subtext); border-collapse: collapse; }
.trust-table td { padding: 2px 12px 2px 0; vertical-align: top; }
.trust-table td:first-child { color: var(--text); font-weight: 600; min-width: 160px; }
.explore-row { display: flex; gap: 8px; align-items: center; }
.explore-btn {
  display: inline-flex; align-items: center;
  padding: 7px 15px; font-size: 12px; font-weight: 600;
  background: var(--cat-color, var(--blue)); color: #fff;
  text-decoration: none; border-radius: 4px;
  transition: opacity 0.15s; border: none; cursor: pointer;
}
.explore-btn:hover { opacity: 0.85; }
.copy-link-btn {
  padding: 6px 13px; font-size: 11px;
  border: 0.5px solid var(--border); border-radius: 4px;
  background: transparent; color: var(--subtext); cursor: pointer;
  transition: all 0.12s;
}
.copy-link-btn:hover { border-color: var(--blue); color: var(--blue); }


/* floating tooltip for state map hover */
#map-tooltip {
  position: fixed; background: rgba(0,0,0,0.82); color: #fff;
  padding: 4px 10px; border-radius: 4px; font-size: 10px; font-family: var(--body-font);
  pointer-events: none; white-space: nowrap; z-index: 9999;
  opacity: 0; transition: opacity 0.1s;
}
/* map zoom controls */
.map-zoom-btn {
  background: var(--surface); border: 0.5px solid var(--border);
  border-radius: 3px; width: 20px; height: 20px; cursor: pointer;
  font-size: 13px; line-height: 1; color: var(--subtext);
  display: flex; align-items: center; justify-content: center; padding: 0;
}
.map-zoom-btn:hover { border-color: var(--blue); color: var(--blue); }

/* ══ 7 · RESPONSIVE ═══════════════════════════════════════════════════════════ */
@media (max-width: 900px) {
  #card-grid    { grid-template-columns: repeat(2, 1fr); padding: 0 1rem; }
  .charts-grid  { grid-template-columns: 1fr; }
}
@media (max-width: 600px) {
  #card-grid      { grid-template-columns: 1fr; padding: 0 0.75rem; }
  .hero-top       { flex-wrap: wrap; gap: 0.75rem; }
  .hero-chips     { gap: 1rem; }
  .chip-val       { font-size: 18px; }
  .controls-inner { gap: 0.75rem; }
  .filters        { gap: 0.75rem; }
  .detail-footer  { flex-direction: column; align-items: flex-start; }
}

/* ══ 8 · PRINT ════════════════════════════════════════════════════════════════ */
@media print {
  body { background: white; font-size: 11pt; }
  .hero { position: static; background: white !important; border-bottom: 1pt solid #ccc; padding: 0.5rem 0; }
  .hero-name { color: black !important; font-size: 16pt; }
  .hero-sub, .chip-lbl { color: #555 !important; }
  .chip-val { color: black !important; font-size: 16pt; }
  .controls-bar { display: none !important; }
  #card-grid { display: block; padding: 0; margin: 0.5rem 0 0; }
  .summary-card {
    display: block !important; page-break-inside: avoid; break-inside: avoid;
    border: 0.5pt solid #ccc !important; border-top: 2pt solid #333 !important;
    margin-bottom: 0.75rem; box-shadow: none !important;
    opacity: 1 !important; animation: none !important;
  }
  .expand-btn, .charts-toggle, .copy-link-btn, .trust-btn,
  .trust-panel, .reset-btn, .dark-btn, .search-wrap { display: none !important; }
  .detail-panel { max-height: none !important; overflow: visible !important; border-top: 0.5pt solid #ccc; }
  .charts-panel { display: block !important; }
  .charts-grid  { grid-template-columns: repeat(2, 1fr); gap: 0.5rem; }
  .prose-text   { font-size: 10pt; }
  .detail-prose { grid-template-columns: 1fr !important; }
  .cat-badge, .section-badge, .stat-val, .prose-label { color: #333 !important; }
  .explore-btn  { background: transparent !important; color: black !important;
                  border: 0.5pt solid #333 !important; padding: 3px 8px; font-size: 9pt; }
  .explore-btn::after { content: " (" attr(href) ")"; font-size: 8pt; color: #555; }
  .card--dimmed { display: none !important; }
}
/* ── Guided tour ─────────────────────────────────────────────────────────── */
#tour-root { position: fixed; inset: 0; z-index: 99990; }
.tour-blocker { position: fixed; inset: 0; z-index: 99991; cursor: default; }
.tour-spot {
  position: fixed; border-radius: 12px; pointer-events: none; z-index: 99992;
  box-shadow: 0 0 0 9999px rgba(12, 16, 32, 0.70),
              0 0 0 2px rgba(124, 90, 255, 0.95),
              0 0 26px 4px rgba(124, 90, 255, 0.55);
  transition: top .28s cubic-bezier(.4,0,.2,1), left .28s cubic-bezier(.4,0,.2,1),
              width .28s cubic-bezier(.4,0,.2,1), height .28s cubic-bezier(.4,0,.2,1);
}
.tour-tip {
  position: fixed; z-index: 99993; width: 312px; max-width: calc(100vw - 24px);
  color: var(--text);
  border: 2px solid transparent; border-radius: 14px;
  background:
    linear-gradient(var(--surface), var(--surface)) padding-box,
    linear-gradient(135deg, #3E00C9, #0062FD, #FFB347) border-box;
  padding: 17px 19px 14px; box-shadow: 0 14px 40px rgba(8, 10, 25, 0.40);
  animation: tourPop .26s cubic-bezier(.34,1.56,.64,1);
}
@keyframes tourPop { from { opacity: 0; transform: scale(.94) translateY(8px); } to { opacity: 1; transform: none; } }
.tour-x { position: absolute; top: 9px; right: 11px; border: none; background: none;
  color: var(--subtext); font-size: 18px; line-height: 1; cursor: pointer; padding: 2px; }
.tour-x:hover { color: var(--text); }
.tour-text { margin: 4px 0 13px; font-size: 13.5px; line-height: 1.55; padding-right: 10px; }
.tour-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.tour-dots { display: flex; gap: 5px; align-items: center; }
.tour-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--border); transition: all .2s ease; }
.tour-dot.done { background: var(--subtext); }
.tour-dot.on { width: 17px; border-radius: 3px; background: linear-gradient(90deg, #3E00C9, #0062FD); }
.tour-btns { display: flex; gap: 6px; }
.tour-btns button {
  font-size: 11px; font-weight: 600; padding: 5px 13px; border-radius: 8px; cursor: pointer;
  border: 0.5px solid var(--border); background: var(--surface); color: var(--text);
  transition: filter .12s, transform .12s;
}
.tour-btns button:hover { filter: brightness(1.06); transform: translateY(-1px); }
.tour-skip { color: var(--subtext); font-weight: 500; }
.tour-next { border: none; color: #fff; background: linear-gradient(135deg, #3E00C9, #0062FD); }
#tour-btn svg { width: 15px; height: 15px; display: block; }
@media print { #tour-root, #tour-btn { display: none !important; } }
</style>
</head>
<body>

<header class="hero" id="hero"></header>
<div class="controls-bar" id="controls-bar"></div>
<main id="card-grid"></main>

<script>__CHARTJS__</script>
<script>const REPORT_DATA = __REPORT_DATA__;</script>

(function () {
'use strict';

const D = REPORT_DATA;

// Fast id → insight lookup (avoids O(n) scans inside filter/sort loops).
const _byId = new Map(D.insights.map(i => [i.id, i]));
// Corpus baseline maps, built once (full_corpus is static) instead of being
// rebuilt per-insight on every filter pass.
const _corpusMaps = {};
['metro','grade','efs','teacher_of_color','state','project_category'].forEach(f => {
  const fc = D.full_corpus[f];
  _corpusMaps[f] = fc ? Object.fromEntries(fc.labels.map((l, i) => [l, fc.values[i] || 0])) : {};
});

const TIER_COLORS   = { A: '#3E00C9', B: '#FFB347', C: '#0062FD', D: '#7A8493' };
const NO_TIER_COLOR = '#B0B7C0';

// ── US state tile grid (col, row) — 13 cols × 8 rows (50 states + DC) ─────
const STATE_GRID = {
  AK:{c:0,r:0},                                                                                                           ME:{c:11,r:0},
  WA:{c:1,r:1}, MT:{c:2,r:1}, ND:{c:3,r:1}, MN:{c:4,r:1},                               VT:{c:10,r:1}, NH:{c:11,r:1},
  OR:{c:1,r:2}, ID:{c:2,r:2}, WY:{c:3,r:2}, SD:{c:4,r:2}, WI:{c:6,r:2}, MI:{c:7,r:2},  NY:{c:9,r:2},  MA:{c:10,r:2}, RI:{c:11,r:2},
  CA:{c:1,r:3}, NV:{c:2,r:3}, UT:{c:3,r:3}, CO:{c:4,r:3}, NE:{c:5,r:3}, IA:{c:6,r:3}, IL:{c:7,r:3}, IN:{c:8,r:3}, OH:{c:9,r:3}, PA:{c:10,r:3}, NJ:{c:11,r:3}, CT:{c:12,r:3},
               AZ:{c:2,r:4}, NM:{c:3,r:4}, KS:{c:4,r:4}, MO:{c:5,r:4}, TN:{c:6,r:4}, KY:{c:7,r:4}, WV:{c:8,r:4}, VA:{c:9,r:4}, MD:{c:10,r:4}, DE:{c:11,r:4},
                             OK:{c:4,r:5}, AR:{c:5,r:5}, MS:{c:6,r:5}, AL:{c:7,r:5}, GA:{c:8,r:5}, NC:{c:9,r:5}, SC:{c:10,r:5}, DC:{c:11,r:5},
                             TX:{c:4,r:6}, LA:{c:5,r:6},                             FL:{c:8,r:6},
  HI:{c:1,r:7},
};

// ── App state ──────────────────────────────────────────────────────────────
let filters        = {};
let activeGroup    = '__all__';
let searchQ        = '';
let expandedId     = null;
let chartsRendered = {};

const EFS_ORDER   = ['Race+Inc','Rural','Race','Inc','NonEFS'];
const GRADE_ORDER = ['Grades PreK-2','Grades 3-5','Grades 6-8','Grades 9-12'];

// ── Helpers ────────────────────────────────────────────────────────────────
function esc(s) {
  if (s == null) return '';
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function hexToRgba(hex, alpha) {
  const r = parseInt(hex.slice(1,3), 16);
  const g = parseInt(hex.slice(3,5), 16);
  const b = parseInt(hex.slice(5,7), 16);
  return `rgba(${r},${g},${b},${alpha.toFixed(2)})`;
}

function displayCategory(ins) {
  const b = ins.category_bucket;
  if (!b || b === '' || b.toLowerCase() === 'none' || b.toLowerCase() === 'nan' || ins.is_cross)
    return 'Across ' + (ins.group_display || 'Categories');
  return b;
}

function sectionLabel(ins) {
  const rs = (ins.report_section || '').toLowerCase();
  if (rs.includes('main'))     return 'top insight';
  if (rs.includes('appendix')) return 'secondary insight';
  return '';
}

function catColor(ins) {
  return TIER_COLORS[ins.tier] || NO_TIER_COLOR;
}

function insById(id) {
  return _byId.get(id) || {};
}

// ── Controls ────────────────────────────────────────────────────────────────
function renderControls() {
  const _fundingOpts = (D.full_corpus.funding || {}).labels || [];
  const _tierOpts    = [...new Set(D.insights.map(i => i.tier).filter(Boolean))].sort();
  const _tocOpts     = labelsFor('teacher_of_color');
  const _projCatOpts = labelsFor('project_category').filter(l => l && l !== 'None' && l !== 'nan');
  const _stateOpts   = labelsFor('state');
  const dims = {
    ...(_tierOpts.length ? { tier: { label: 'Insight tier', opts: _tierOpts } } : {}),
    grade:            { label: 'Grade level',     opts: labelsFor('grade') },
    efs:              { label: 'EFS',             opts: EFS_ORDER.filter(v => labelsFor('efs').includes(v)) },
    metro:            { label: 'Metro type',      opts: labelsFor('metro') },
    ...(_fundingOpts.length ? { funding: { label: 'Funded status', opts: _fundingOpts } } : {}),
    ...(_tocOpts.length     ? { teacher_of_color: { label: 'Teacher of color', opts: _tocOpts } } : {}),
    ...(_projCatOpts.length ? { project_category: { label: 'Project category', opts: _projCatOpts.sort() } } : {}),
    ...(_stateOpts.length   ? { state: { label: 'State', opts: _stateOpts } } : {}),
  };

  const filtersHtml = Object.entries(dims).map(([key, dim]) => `
    <div class="filter-group${(key === 'state' || key === 'project_category') ? ' filter-group--wide' : ''}">
      <div class="filter-label">${dim.label}</div>
      <div class="filter-opts" data-field="${key}">
        ${dim.opts.map(o => `<button class="filter-chip" data-value="${esc(o)}">${esc(o)}</button>`).join('')}
      </div>
    </div>`).join('');

  const _tabs = (D.meta.group_tabs || []);
  const tabsHtml = _tabs.length ? `
    <div class="tabs-inner" id="tabs-section">
      <button class="controls-label section-toggle" onclick="window.__toggleSection('tabs-section')">
        <span class="section-chevron">▾</span>Groups
      </button>
      <div class="group-tabs" id="group-tabs">
        <button class="group-tab active" data-group="__all__">All groups</button>
        ${_tabs.map(t => `<button class="group-tab" data-group="${esc(t.key)}" data-full="${esc(t.label)}">${esc(t.label)}</button>`).join('')}
      </div>
    </div>` : '';

  document.getElementById('controls-bar').innerHTML = `
    ${tabsHtml}
    <div class="controls-inner" id="skew-section">
      <button class="controls-label section-toggle" onclick="window.__toggleSection('skew-section')">
        <span class="section-chevron">▾</span>Skews toward
      </button>
      <div class="filters" id="filter-area">${filtersHtml}</div>
      <div class="search-wrap">
        <div style="display:flex;align-items:center;gap:5px">
          <span class="search-icon">⌕</span>
          <input type="search" class="search-input" id="search-input"
                 placeholder="Search insights…"
                 onkeydown="if(event.key==='Enter'){event.preventDefault();window.__runSearch();}">
          <button class="search-btn" onclick="window.__runSearch()">Search</button>
        </div>
        <button class="reset-btn" id="reset-btn" style="display:none" onclick="window.__resetFilters()">Reset</button>
      </div>
    </div>`;

  document.querySelectorAll('.group-tab').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.group-tab').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeGroup = btn.dataset.group;
      applyFilterDisplay();
    });
  });

  document.querySelectorAll('.filter-chip').forEach(btn => {
    btn.addEventListener('click', () => {
      const field = btn.closest('[data-field]').dataset.field;
      const val   = btn.dataset.value;
      if (!filters[field]) filters[field] = new Set();
      if (filters[field].has(val)) { filters[field].delete(val); btn.classList.remove('active'); }
      else                         { filters[field].add(val);    btn.classList.add('active');    }
      const any = Object.values(filters).some(s => s.size > 0);
      document.getElementById('reset-btn').style.display = (any || searchQ) ? 'inline-flex' : 'none';
      applyFilterDisplay();
    });
  });
}

function labelsFor(field) {
  return (D.full_corpus[field] || {}).labels || [];
}

window.__resetFilters = function () {
  filters = {}; searchQ = '';
  activeGroup = '__all__';
  document.querySelectorAll('.group-tab').forEach(b => b.classList.toggle('active', b.dataset.group === '__all__'));
  document.querySelectorAll('.filter-chip').forEach(b => b.classList.remove('active'));
  const si = document.getElementById('search-input'); if (si) si.value = '';
  document.getElementById('reset-btn').style.display = 'none';
  applyFilterDisplay();
};

window.__toggleSection = function (id) {
  const el = document.getElementById(id);
  if (el) el.classList.toggle('collapsed');
};

window.__toggleDark = function () {
  const isDark = document.documentElement.dataset.theme === 'dark';
  document.documentElement.dataset.theme = isDark ? '' : 'dark';
  const btn = document.getElementById('dark-toggle');
  if (btn) btn.textContent = isDark ? '🌙' : '☀️';
};

window.__runSearch = function () {
  const si = document.getElementById('search-input');
  searchQ = si ? si.value : '';
  const any = Object.values(filters).some(s => s.size > 0) || searchQ.trim();
  document.getElementById('reset-btn').style.display = any ? 'inline-flex' : 'none';
  applyFilterDisplay();
};

// ── Filter + search display (no DOM re-render — CSS order + dimmed class) ──
function getDimmedIds() {
  const q    = searchQ.trim().toLowerCase();
  const anyF = Object.values(filters).some(s => s.size > 0);
  if (!anyF && !q) return new Set();

  const dimmed = new Set();
  D.insights.forEach(ins => {
    let passes = true;

    // Demographic filters: insight must overlap with each active dimension
    ['metro','grade','efs','teacher_of_color','state'].forEach(field => {
      const sel = filters[field];
      if (!sel || sel.size === 0) return;
      const ch = ins.charts && ins.charts[field];
      if (!ch) { passes = false; return; }
      const _fcMap = _corpusMaps[field];
      // Insight 'matches' if it has at least the corpus-average share of the selected label
      const overlap = ch.labels.some((lbl, i) => sel.has(lbl) && (ch.values[i]||0) >= (_fcMap[lbl]||0));
      if (!overlap) passes = false;
    });

    // Project category filter — same overlap logic as metro/grade/efs
    const projCatSel = filters['project_category'];
    if (projCatSel && projCatSel.size > 0) {
      const ch = ins.charts && ins.charts.project_category;
      if (!ch) { passes = false; }
      else {
        const _fcMap = _corpusMaps.project_category;
        const overlap = ch.labels.some((lbl, i) => projCatSel.has(lbl) && (ch.values[i]||0) >= (_fcMap[lbl]||0));
        if (!overlap) passes = false;
      }
    }

    // Funded status filter
    const fundSel = filters['funding'];
    if (fundSel && fundSel.size > 0) {
      const ch = ins.charts && ins.charts.funding;
      if (!ch) { passes = false; }
      else {
        const overlap = ch.labels.some((lbl, i) => fundSel.has(lbl) && (ch.values[i] || 0) > 0);
        if (!overlap) passes = false;
      }
    }

    // Insight tier filter — direct match on the insight's tier
    const tierSel = filters['tier'];
    if (tierSel && tierSel.size > 0 && !tierSel.has(ins.tier)) passes = false;

    // Full-text search: title + prose + item names — case-insensitive substring,
    // so a partial term ("absent") surfaces "absenteeism".
    if (q) {
      const itemText = (ins.item_names || [])
        .map(n => Array.isArray(n) ? n[0] : String(n)).join(' ');
      const haystack = [ins.title, ins.finding, ins.evidence_basis, ins.scope_or_caveat, ins.why_it_matters, itemText]
        .join(' ').toLowerCase();
      const words = q.split(/\s+/).filter(Boolean);
      if (!words.every(w => haystack.includes(w))) passes = false;
    }

    if (!passes) dimmed.add(ins.id);
  });
  return dimmed;
}

function applyFilterDisplay() {
  const dimmedIds = getDimmedIds();
  const anyActive = Object.values(filters).some(s => s.size > 0) || searchQ.trim();

  const grid  = document.getElementById('card-grid');
  const cards = Array.from(grid.querySelectorAll('.summary-card'));

  // Group tab: show only the active group (or all groups)
  const inActiveGroup = id =>
    activeGroup === '__all__' || insById(id).group_key === activeGroup;
  cards.forEach(card => { card.style.display = inActiveGroup(card.dataset.id) ? '' : 'none'; });

  // Collapse expanded card if it became hidden (out of group) or dimmed
  if (expandedId && (!inActiveGroup(expandedId) || dimmedIds.has(expandedId))) collapseCard(expandedId);

  // Update dim state on all cards
  cards.forEach(card => {
    card.classList.toggle('card--dimmed', dimmedIds.has(card.dataset.id));
    card.style.order = '';
  });

  if (!anyActive) {
    sortedInsights().forEach(ins => {
      const card = document.getElementById('card-' + ins.id);
      if (card) grid.appendChild(card);
    });
    return;
  }

  // Re-order DOM: matching first (by score desc), non-matching appended after.
  // appendChild on an existing child moves it — no innerHTML re-render needed.
  const matching    = cards.filter(c => !dimmedIds.has(c.dataset.id))
    .sort((a, b) => score(insById(b.dataset.id)) - score(insById(a.dataset.id)));
  const nonMatching = cards.filter(c => dimmedIds.has(c.dataset.id));
  [...matching, ...nonMatching].forEach(card => grid.appendChild(card));
}

// ── Relevance scoring ────────────────────────────────────────────────────────
function score(ins) {
  let s = 0;
  ['metro','grade','efs','teacher_of_color','state'].forEach(field => {
    const sel = filters[field];
    if (!sel || sel.size === 0) return;
    const ch = ins.charts && ins.charts[field];
    if (!ch) return;
    sel.forEach(v => { const idx = ch.labels.indexOf(v); if (idx >= 0) s += ch.values[idx]; });
  });
  const projCatSel2 = filters['project_category'];
  if (projCatSel2 && projCatSel2.size > 0) {
    const ch = ins.charts && ins.charts.project_category;
    if (ch) ch.labels.forEach((lbl, i) => { if (projCatSel2.has(lbl)) s += ch.values[i] || 0; });
  }
  const fundSel2 = filters['funding'];
  if (fundSel2 && fundSel2.size > 0) {
    const ch = ins.charts && ins.charts.funding;
    if (ch) ch.labels.forEach((lbl, i) => { if (fundSel2.has(lbl)) s += ch.values[i] || 0; });
  }
  return s;
}

function sortedInsights() {
  return D.insights.slice().sort((a, b) => {
    const aMain = !!(a.report_section && a.report_section.includes('main'));
    const bMain = !!(b.report_section && b.report_section.includes('main'));
    // 1. All top tiles before all secondary tiles
    if (aMain !== bMain) return aMain ? -1 : 1;
    // 2. Within each tier, cross-category before by-group
    if (a.is_cross !== b.is_cross) return a.is_cross ? -1 : 1;
    // 3. By-group: sort alphabetically by category name
    if (!a.is_cross && !b.is_cross) {
      const aCat = (a.category_bucket || '').toLowerCase();
      const bCat = (b.category_bucket || '').toLowerCase();
      if (aCat !== bCat) return aCat < bCat ? -1 : 1;
    }
    // 4. Tiebreak: project count descending
    return b.project_count - a.project_count;
  });
}

// ── Signal bar ───────────────────────────────────────────────────────────────
function sigBar(ratio, color) {
  const filled = Math.min(5, Math.round(ratio * 5));
  const blocks = Array.from({length: 5}, (_, i) =>
    `<span class="sig-block${i < filled ? ' filled' : ''}"${i < filled ? ` style="background:${color}"` : ''}></span>`
  ).join('');
  return `<span class="sig-label">Signal</span>
          <div class="sig-bar">${blocks}</div>
          <span class="sig-pct">${Math.round(ratio * 100)}%</span>`;
}

// ── State tile map (inline SVG) ──────────────────────────────────────────────
function buildStateMap(ins, color) {
  const ch = ins.charts && ins.charts.state;
  if (!ch || !(ch.labels || []).length) {
    return `<div style="font-size:10px;color:var(--subtext);padding:20px 0;text-align:center">No state data</div>`;
  }

  const pctMap = {};
  ch.labels.forEach((lbl, i) => { pctMap[lbl] = ch.values[i] || 0; });
  const maxPct = Math.max(...Object.values(pctMap), 0.001);

  // Full corpus baseline for delta computation
  const fcState = D.full_corpus.state;
  const fcMap   = {};
  if (fcState && fcState.labels) fcState.labels.forEach((l, i) => { fcMap[l] = fcState.values[i] || 0; });

  // Compute delta per state and identify top outliers (up to 6)
  const deltaPp = {};
  Object.keys(STATE_GRID).forEach(a => { deltaPp[a] = ((pctMap[a]||0) - (fcMap[a]||0)) * 100; });
  const topOutliers = new Set(
    Object.entries(deltaPp)
      .sort((a, b) => Math.abs(b[1]) - Math.abs(a[1]))
      .slice(0, 14)
      .filter(([,d]) => Math.abs(d) >= 0.5)
      .map(([k]) => k)
  );

  const CELL = 24, GAP = 2, COLS = 13, ROWS = 8;
  const W = COLS * (CELL + GAP), H = ROWS * (CELL + GAP);

  let tiles = '';
  Object.entries(STATE_GRID).forEach(([abbr, pos]) => {
    const pct       = pctMap[abbr] || 0;
    const intensity = pct / maxPct;
    const fill      = hexToRgba(color, 0.07 + intensity * 0.87);
    const textFill  = intensity > 0.55 ? '#fff' : 'var(--subtext)';
    const x = pos.c * (CELL + GAP), y = pos.r * (CELL + GAP);
    const d = deltaPp[abbr];
    const dStr = (d >= 0 ? '+' : '') + d.toFixed(1) + 'pp';
    const hoverTip = `${abbr}: ${(pct*100).toFixed(2)}% of insight  (${dStr} vs population)`;

    tiles += `<g data-tip="${hoverTip}" data-mapidx="${Object.keys(STATE_GRID).indexOf(abbr)}" style="opacity:0;transition:opacity 0.18s ease">`;
    tiles += `<rect x="${x}" y="${y}" width="${CELL}" height="${CELL}" rx="2" fill="${fill}"/>`;

    if (topOutliers.has(abbr)) {
      // Two-line: abbrev + delta
      const dColor = d > 0 ? '#0D8C5E' : '#C94C1F';
      const dFill  = intensity > 0.6 ? (d > 0 ? '#6FFFD0' : '#FFAA88') : dColor;
      tiles += `<text x="${x+CELL/2}" y="${y+CELL/2-1}" font-size="6" text-anchor="middle"`
             + ` fill="${textFill}" font-family="'Helvetica Neue',Arial,sans-serif" font-weight="700">${abbr}</text>`;
      tiles += `<text x="${x+CELL/2}" y="${y+CELL/2+7}" font-size="5" text-anchor="middle"`
             + ` fill="${dFill}" font-family="'Helvetica Neue',Arial,sans-serif" font-weight="700">${dStr}</text>`;
    } else {
      tiles += `<text x="${x+CELL/2}" y="${y+CELL/2+3.5}" font-size="6.5" text-anchor="middle"`
             + ` fill="${textFill}" font-family="'Helvetica Neue',Arial,sans-serif" font-weight="600">${abbr}</text>`;
    }
    tiles += `</g>`;
  });

  const svgStr = `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block"
               aria-label="Project distribution by state for ${esc(ins.title)}">${tiles}</svg>`;
  return `<div class="map-zoom-container" style="position:relative;overflow:hidden;min-height:230px">
    <div style="position:absolute;top:4px;right:4px;z-index:2;display:flex;gap:3px">
      <button class="map-zoom-btn" data-mapzoom="in"  title="Zoom in">＋</button>
      <button class="map-zoom-btn" data-mapzoom="out" title="Zoom out">−</button>
    </div>
    <div class="map-svg-wrap" style="transform-origin:top left">${svgStr}</div>
  </div>`;
}

// ── Items table ──────────────────────────────────────────────────────────────
function itemsTableHTML(ins) {
  if (!ins.item_names || !ins.item_names.length) return '';
  const rows = ins.item_names.map(item => {
    const name = Array.isArray(item) ? item[0] : item;
    const qty  = Array.isArray(item) ? item[1] : '';
    return `<tr><td>${esc(name)}</td><td>${qty !== '' ? Number(qty).toLocaleString() : '—'}</td></tr>`;
  }).join('');
  return `
<div class="items-table-wrap">
  <table class="items-table">
    <thead><tr><th>Top Items</th><th>Qty</th></tr></thead>
    <tbody>${rows}</tbody>
  </table>
</div>`;
}

// ── Card HTML ────────────────────────────────────────────────────────────────
function renderCards() {
  const grid = document.getElementById('card-grid');
  grid.innerHTML = sortedInsights().map(ins => cardHTML(ins)).join('');

  document.querySelectorAll('.summary-card').forEach(card => {
    const id = card.dataset.id;
    card.addEventListener('click', e => {
      if (e.target.closest('.detail-panel') || e.target.closest('.expand-btn') || e.target.closest('a')) return;
      toggleCard(id);
    });
    card.querySelector('.expand-btn').addEventListener('click', () => toggleCard(id));
  });

  // Staggered tile fade-in
  document.querySelectorAll('.summary-card').forEach((card, i) => {
    const tileDelay = Math.min(i * 45, 450);
    card.style.animationDelay = tileDelay + 'ms';
  });

  handleAnchor();
}

  return `
<article class="summary-card" id="card-${ins.id}" data-id="${ins.id}" style="--cat-color:${color}">
  <div class="card-header">
    <div class="card-badges">

// ── Expand / Collapse ────────────────────────────────────────────────────────
function toggleCard(id) {
  if (expandedId === id) { collapseCard(id); return; }

  if (expandedId) {
    // Collapse current card first; expand new one after its animation finishes
    collapseCard(expandedId);
    const _id = id;
    setTimeout(() => {
      const el = document.querySelector(`[data-id="${_id}"]`);
      if (el) expandCard(_id, el, true);
    }, 310);
  } else {
    const el = document.querySelector(`[data-id="${id}"]`);
    if (el) expandCard(id, el, true);
  }
}

function ensureDetail(id) {
  const panel = document.getElementById('detail-' + id);
  if (!panel || panel.dataset.built) return;
  const ins = insById(id);
  panel.innerHTML = detailHTML(ins, catColor(ins));
  panel.dataset.built = '1';
}

function expandCard(id, el, scroll) {
  ensureDetail(id);
  expandedId = id;
  el.classList.add('expanded');
  history.replaceState(null, '', '#' + id);

  const detail = document.getElementById('detail-' + id);

  // Animate height open
  detail.style.transition = 'max-height 0.32s ease';
  detail.style.maxHeight  = detail.scrollHeight + 'px';
  setTimeout(() => {
    detail.style.transition = '';
    detail.style.maxHeight  = 'none';   // allow free resize after open
    detail.style.overflow   = '';
  }, 340);

  if (scroll) {
    // Scroll to approximate position immediately, then correct once animation settles
    const _scrollTo = () => {
      // Compute offset from actual sticky bar heights so the card top
      // appears just below the controls bar regardless of hero content size.
      const hero   = document.getElementById('hero');
      const cb     = document.getElementById('controls-bar');
      const offset = (hero ? hero.offsetHeight : 0) + (cb ? cb.offsetHeight : 0) + 14;
      const y      = el.getBoundingClientRect().top + window.scrollY - offset;
      window.scrollTo({top: y, behavior: 'smooth'});
    };
    setTimeout(_scrollTo, 60);
    setTimeout(_scrollTo, 380);
  }

  // Render charts once, then stagger-fade each chart-item in (Extra 1)
  if (!chartsRendered[id]) {
    chartsRendered[id] = true;
    el.querySelectorAll('.chart-item').forEach(item => { item.style.opacity = '0'; });
    setTimeout(() => {
      lazyRenderCharts(id);
      el.querySelectorAll('.chart-item').forEach((item, i) => {
        setTimeout(() => {
          item.style.transition = 'opacity 0.22s ease';
          item.style.opacity    = '1';
        }, i * 55);
      });
    }, 600);
  }
}

function collapseCard(id) {
  const el = document.querySelector(`[data-id="${id}"]`);
  if (!el) return;
  const detail = document.getElementById('detail-' + id);

  // Lock current height, then animate to 0
  detail.style.overflow   = 'hidden';
  detail.style.maxHeight  = detail.scrollHeight + 'px';
  void detail.offsetHeight;                        // force reflow
  detail.style.transition = 'max-height 0.28s ease';
  detail.style.maxHeight  = '0px';
  setTimeout(() => { detail.style.transition = ''; }, 290);

  el.classList.remove('expanded');
  if (expandedId === id) {
    expandedId = null;
    history.replaceState(null, '', window.location.pathname + window.location.search);
  }
}

// ── Charts toggle ────────────────────────────────────────────────────────────
window.__toggleCharts = function (id) {
  const panel  = document.getElementById('chartspanel-' + id);
  const toggle = document.getElementById('chartstoggle-' + id);
  if (!panel) return;
  if (panel.style.display === 'none') {
    panel.style.display = 'block';
    toggle.textContent  = 'Hide charts ▲';
    if (!chartsRendered[id]) { chartsRendered[id] = true; lazyRenderCharts(id); }
  } else {
    panel.style.display = 'none';
    toggle.textContent  = 'View supporting charts ▼';
  }
};

window.__toggleTrust = function (id) {
  const p = document.getElementById('trust-' + id);
  if (p) p.style.display = p.style.display === 'none' ? 'block' : 'none';
};

// ── Baseline + delta annotation plugin ──────────────────────────────────────
// Draws: (1) tick mark at baseline value, (2) ±Xpp delta label per bar.
const BASELINE_PLUGIN = {
  id: 'bl',
  afterDatasetsDraw(chart) {
    const bl = chart.options.plugins.bl;
    if (!bl) return;

    const ctx    = chart.ctx;
    const xs     = chart.scales.x;
    const ys     = chart.scales.y;
    const isRace = chart.options.plugins._isRace || false;
    const data   = chart.data.datasets[0]?.data || [];

    bl.forEach((baseVal, i) => {
      if (baseVal == null) return;

      const insVal = data[i] ?? 0;
      const y      = ys.getPixelForValue(i);
      const h      = ys.height / ((ys.ticks?.length ?? 5) * 2.5);
      const bx     = xs.getPixelForValue(baseVal);

      // Baseline tick mark
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(bx, y - h); ctx.lineTo(bx, y + h);
      ctx.strokeStyle = 'rgba(0,0,0,0.55)';
      ctx.lineWidth   = 1.5;
      ctx.stroke();
      ctx.restore();

      // Delta label (±Xpp)
      const delta = isRace ? insVal - baseVal : (insVal - baseVal) * 100;
      if (Math.abs(delta) < 0.4) return;

      const sign    = delta > 0 ? '+' : '−';
      const label   = `${sign}${Math.abs(delta).toFixed(1)}pp`;
      const fgColor = delta > 0 ? '#0D8C5E' : '#C94C1F';
      const barX    = xs.getPixelForValue(insVal);
      const labelX  = Math.max(barX, bx) + 4;
      if (labelX > xs.right - 4) return;       // skip if it would clip

      ctx.save();
      ctx.font         = 'bold 7.5px "Helvetica Neue", Arial, sans-serif';
      ctx.fillStyle    = fgColor;
      ctx.textBaseline = 'middle';
      ctx.fillText(label, labelX, y);
      ctx.restore();
    });
  }
};

// ── Chart rendering ──────────────────────────────────────────────────────────
function lazyRenderCharts(id) {
  const ins = _byId.get(id);
  if (!ins) return;
  const color = catColor(ins);

    // Demographic + detail bar charts
      // Demographic + detail bar charts
  ['metro','grade','efs','race','posting','cost_distr','enroll_distr','project_category','funding','teacher_of_color'].forEach(field => {
    const ch     = ins.charts && ins.charts[field];
    if (!ch) return;
    const canvas = document.getElementById(`cv-${id}-${field}`);
    if (!canvas || canvas._chartInst) return;

    const isRace = field === 'race';

    // For grade, reorder to developmental sequence (PreK-2 at top)
    let labels   = ch.labels;
    let values   = ch.values;
    let baseline = ch.baseline;
    if (field === 'grade') {
      const gradeIdx = ch.labels.map((_, i) => i)
        .sort((a, b) => {
          const ai = GRADE_ORDER.indexOf(ch.labels[a]);
          const bi = GRADE_ORDER.indexOf(ch.labels[b]);
          return (ai < 0 ? 99 : ai) - (bi < 0 ? 99 : bi);
        });
      labels   = gradeIdx.map(i => ch.labels[i]);
      values   = gradeIdx.map(i => ch.values[i]);
      baseline = ch.baseline ? gradeIdx.map(i => ch.baseline[i]) : ch.baseline;
    }

    // For project category, sort descending so the largest category sits at the top
    if (field === 'project_category') {
      const projIdx = ch.labels.map((_, i) => i)
        .sort((a, b) => (ch.values[b] || 0) - (ch.values[a] || 0));
      labels   = projIdx.map(i => ch.labels[i]);
      values   = projIdx.map(i => ch.values[i]);
      baseline = ch.baseline ? projIdx.map(i => ch.baseline[i]) : ch.baseline;
    }

    // Uniform fill — delta communicated via ±pp annotations, not bar colour
    const barBg = color + 'CC';

    canvas._chartInst = new Chart(canvas, {
      type: 'bar',
      plugins: [BASELINE_PLUGIN],
      data: {
        labels: labels,
        datasets: [{
          data:            values,
          backgroundColor: barBg,
          borderColor:     color,
          borderWidth:     1,
          borderRadius:    3,
        }],
      },
      options: {
        indexAxis: 'y', responsive: true, maintainAspectRatio: false,
        layout: { padding: { right: 46 } },   // room for ±Xpp labels
        plugins: {
          legend:  { display: false },
          bl:      baseline,
          _isRace: isRace,
          tooltip: {
            callbacks: {
              label: ctx => isRace
                ? ` ${ctx.raw.toFixed(1)}%`
                : ` ${(ctx.raw * 100).toFixed(1)}%`
            }
          },
        },
        scales: {
          x: {
            max: Math.min(ch.xmax || 1, isRace ? 100 : 1),
            grid:  { color: '#ece9e1', lineWidth: 0.5 },
            ticks: { font:{size:10}, color:'#bbb', maxTicksLimit:4,
                     callback: v => isRace ? v.toFixed(0)+'%' : (v*100).toFixed(0)+'%' },
            border: { display: false },
          },
          y: {
            grid:  { display: false },
            ticks: { font:{size:10}, color:'#444', crossAlign:'far' },
            border: { display: false },
          },
        },
      },
    });
  });

  // Resource category chart — sorted desc (largest at top) + corpus baseline overlay
  const chCat = ins.charts && ins.charts.item_category;
  if (chCat && (chCat.labels||[]).length) {
    const canvas = document.getElementById(`cv-${id}-item_category`);
    if (canvas && !canvas._chartInst) {
      // Reverse so the largest category sits at the top of the chart
      const catLabels   = [...chCat.labels].reverse();
      const catValues   = [...chCat.values].reverse();
      const catBaseline = chCat.baseline ? [...chCat.baseline].reverse() : null;

      canvas._chartInst = new Chart(canvas, {
        type: 'bar',
        plugins: [BASELINE_PLUGIN],
        data: {
          labels: catLabels,
          datasets: [{
            data:            catValues,
            backgroundColor: color + 'CC',
            borderColor:     color,
            borderWidth:     1,
            borderRadius:    3,
          }],
        },
        options: {
          indexAxis: 'y', responsive: true, maintainAspectRatio: false,
          layout: { padding: { right: 46 } },
          plugins: {
            legend:  { display: false },
            bl:      catBaseline,
            _isRace: false,
            tooltip: {
              callbacks: {
                label: ctx => {
                  const pct = (ctx.raw * 100).toFixed(1);
                  const bl  = catBaseline && catBaseline[ctx.dataIndex];
                  if (bl != null) {
                    const d    = (ctx.raw - bl) * 100;
                    const sign = d >= 0 ? '+' : '';
                    return ` ${pct}% of items by qty  (${sign}${d.toFixed(1)}pp vs corpus)`;
                  }
                  return ` ${pct}% of insight items (not in corpus top 10)`;
                }
              }
            },
          },
          scales: {
            x: {
              max:   Math.min(chCat.xmax || 1, 1),
              grid:  { color:'#ece9e1', lineWidth:0.5 },
              ticks: { font:{size:10}, color:'#bbb', maxTicksLimit:4,
                       callback: v => (v*100).toFixed(0)+'%' },
              border: { display:false },
            },
            y: {
              grid:  { display:false },
              ticks: { font:{size:10}, color:'#444', crossAlign:'far' },
              border: { display:false },
            },
          },
        },
      });
    }
  }

  // ── State map fade-in (matches 1000ms bar chart duration) ─────────────────
  const mapTiles = document.querySelectorAll(`#detail-${id} [data-mapidx]`);
  if (mapTiles.length) {
    const GROUP    = 8;       // states per wave — lower = more state-by-state feel
    const TOTAL_MS = 600;
    const waves    = Math.ceil(mapTiles.length / GROUP);
    const step     = TOTAL_MS / waves;
    mapTiles.forEach(tile => {
      const wave = Math.floor(Number(tile.dataset.mapidx) / GROUP);
      setTimeout(() => { tile.style.opacity = '1'; }, wave * step);
    });
  }
}


// ── Anchor handling ──────────────────────────────────────────────────────────
function handleAnchor() {
  const id = window.location.hash.slice(1);
  if (id && id !== expandedId) {
    const el = document.querySelector(`[data-id="${id}"]`);
    if (el) setTimeout(() => expandCard(id, el, true), 80);
  }
}

window.__copyLink = function (id) {
  const url = location.origin + location.pathname + '#' + id;
  navigator.clipboard.writeText(url).then(() => {
    const btn = document.getElementById('copylink-' + id);
    if (btn) { btn.textContent = 'Copied!'; setTimeout(() => { btn.textContent = 'Copy insight link'; }, 1600); }
  }).catch(() => { prompt('Copy this link:', url); });
};

const _tip = document.createElement('div');
_tip.id = 'map-tooltip';
document.body.appendChild(_tip);
document.addEventListener('mouseover', e => {
  const el = e.target.closest('[data-tip]');
  if (el) { _tip.textContent = el.dataset.tip; _tip.style.opacity = '1'; }
  else     { _tip.style.opacity = '0'; }
});
document.addEventListener('mousemove', e => {
  const lw = _tip.offsetWidth || 200;
  _tip.style.left = Math.min(e.clientX + 14, window.innerWidth - lw - 12) + 'px';
  _tip.style.top  = (e.clientY - 36) + 'px';
});

// Group-tab labels: reveal the full name after a 100ms hover, only when truncated
let _gtTipTimer = null;
document.addEventListener('mouseover', e => {
  const gt = e.target.closest('.group-tab');
  if (!gt || gt.scrollWidth <= gt.clientWidth) return;
  clearTimeout(_gtTipTimer);
  _gtTipTimer = setTimeout(() => {
    _tip.textContent = gt.dataset.full || gt.textContent;
    _tip.style.opacity = '1';
  }, 100);
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.group-tab')) { clearTimeout(_gtTipTimer); _tip.style.opacity = '0'; }
});

// ── Map zoom ──────────────────────────────────────────────────────────────
document.addEventListener('click', e => {
  const btn = e.target.closest('[data-mapzoom]');
  if (!btn) return;
  const wrap = btn.closest('.map-zoom-container')?.querySelector('.map-svg-wrap');
  if (!wrap) return;
  const cur  = parseFloat(wrap.style.transform?.match(/scale\(([\d.]+)\)/)?.[1] ?? '1');
  const next = Math.min(Math.max(cur + (btn.dataset.mapzoom === 'in' ? 0.25 : -0.25), 0.5), 3);
  wrap.style.transition = 'transform 0.18s ease';
  wrap.style.transform  = `scale(${next})`;
});

window.addEventListener('resize', positionControlsBar);

// ── Guided tour ──────────────────────────────────────────────────────────
function _tourSection(id, collapsed) {
  const el = document.getElementById(id);
  if (el) el.classList.toggle('collapsed', collapsed);
}
function _tourExpandSections(done) {
  _tourSection('tabs-section', false);
  _tourSection('skew-section', false);
  done();
}
function _tourExpandFirst(done) {
  const card = document.querySelector('#card-grid .summary-card');
  if (!card) { done(); return; }
  const id = card.dataset.id;
  if (expandedId !== id) { toggleCard(id); setTimeout(done, 420); }
  else done();
}
function _tourBeforeProse(done) {
  _tourSection('tabs-section', true);
  _tourSection('skew-section', true);
  const card = document.querySelector('#card-grid .summary-card');
  if (!card) { done(); return; }
  const id = card.dataset.id;
  const scrollAndDone = () => {
    const bar  = document.getElementById('controls-bar');
    const barH = bar ? bar.getBoundingClientRect().height : 0;
    const y    = window.scrollY + card.getBoundingClientRect().top - barH - 164;
    window.scrollTo({ top: Math.max(0, y), behavior: 'smooth' });
    setTimeout(done, 460);
  };
  if (expandedId !== id) { toggleCard(id); setTimeout(scrollAndDone, 380); }
  else setTimeout(scrollAndDone, 80);
}
function _tourBeforeEnd(done) {
  _tourSection('tabs-section', false);
  _tourSection('skew-section', false);
  if (expandedId) collapseCard(expandedId);
  window.scrollTo({ top: 0, behavior: 'smooth' });
  setTimeout(done, 440);
}

function _tourTop(done) {
  if (window.scrollY > 4) { window.scrollTo({ top: 0, behavior: 'smooth' }); setTimeout(done, 320); }
  else done();
}
const TOUR_STEPS = [
  { sel: () => document.querySelector('#card-grid .summary-card'),
    before: _tourTop, noScroll: true,
    text: "Welcome! Each tile below is an insight we found in patterns among our projects. This is still a prototype so expect imperfect intelligence, but they should be roughly on point. The tile's color matches its tier (A\u2013D) which represents its overall quality." },
  { sel: () => document.getElementById('hero-chips') || document.getElementById('hero'),
    text: "This banner sets the scope \u2014 how many projects we analyzed, how many insights came out of them, and the time period they're drawn from." },
  { sel: () => document.getElementById('tabs-section'), before: _tourExpandSections,
    text: "Start here. The insights were uncovered by scanning various project areas. These buttons narrow the view to one area at a time. Pick one or leave \u201cAll groups\u201d to see everything at once." },
  { sel: () => document.getElementById('filter-area'), before: _tourExpandSections,
    text: "These filters pick out patterns that lean toward a trait more than usual. Say, classrooms that are more rural or have more PreK-2nd projects than the overall average. Combine a few to zero in." },
  { sel: () => document.querySelector('.search-wrap'), before: _tourExpandSections,
    text: "Search about what interests you. Be patient: a search may take a few seconds after you press Search or hit Enter to run it." },
  { sel: () => { const c = document.querySelector('#card-grid .summary-card'); return c && c.querySelector('.detail-prose'); },
    before: _tourBeforeProse, noScroll: true,
    text: "Click any tile to open it. Inside, each insight explains what we found, why it matters, and where the claim has limits." },
  { sel: () => { const c = document.querySelector('#card-grid .summary-card'); return c && (c.querySelector('.charts-grid') || c.querySelector('.charts-panel')); },
    before: _tourExpandFirst, noScroll: true,
    text: "The charts compare this insight's underlying projects against all projects. The marker on each bar is the overall average, so you can see where this insight runs higher or lower across various characteristics. Click \u201cExplore project essays\u201d at the bottom to open the real projects behind it in Looker." },
  { sel: () => document.getElementById('tour-btn'), before: _tourBeforeEnd,
    text: "That's the tour! You can replay it anytime by clicking this button. Now dive in and explore." },
];

let _tourEls = null, _tourIndex = 0, _tourDir = 1, _tourFirst = true;

function _tourGo(i, dir) {
  dir = dir || 1; _tourDir = dir;
  if (i < 0) i = 0;
  if (i >= TOUR_STEPS.length) { _tourEnd(); return; }
  const step = TOUR_STEPS[i];
  const proceed = () => {
    const el = step.sel();
    if (!el) { _tourGo(i + dir, dir); return; }
    _tourIndex = i;
    if (!step.noScroll) { try { el.scrollIntoView({ behavior: 'smooth', block: 'center' }); } catch (e) {} }
    setTimeout(() => _tourPlace(el, i), step.noScroll ? 80 : 300);
  };
  step.before ? step.before(proceed) : proceed();
}

function _tourPlace(el, i) {
  const step = TOUR_STEPS[i], r = el.getBoundingClientRect(), pad = 8;
  const s = _tourEls.spot, tip = _tourEls.tip;
  if (_tourFirst) s.style.transition = 'none';
  const top = Math.min(Math.max(6, r.top - pad), window.innerHeight - 60);
  let height = r.height + pad * 2;
  height = Math.min(height, window.innerHeight - top - 8);
  if (height < 24) height = 24;
  s.style.top = top + 'px'; s.style.left = (r.left - pad) + 'px';
  s.style.width = (r.width + pad * 2) + 'px'; s.style.height = height + 'px';
  if (_tourFirst) { void s.offsetWidth; s.style.transition = ''; _tourFirst = false; }

  const isLast = i === TOUR_STEPS.length - 1;
  tip.querySelector('.tour-text').textContent = step.text;
  tip.querySelectorAll('.tour-dot').forEach((d, k) => {
    d.classList.toggle('on', k === i); d.classList.toggle('done', k < i);
  });
  tip.querySelector('.tour-back').style.visibility = i === 0 ? 'hidden' : 'visible';
  tip.querySelector('.tour-next').textContent = isLast ? 'Done' : 'Next';

  tip.style.visibility = 'hidden'; tip.style.display = 'block';
  const tw = tip.offsetWidth, th = tip.offsetHeight;
  let tTop = (top + height) + 6;
  if (tTop + th > window.innerHeight - 8) tTop = top - th - 6;
  if (tTop < 8) tTop = 8;
  let left = r.left;
  if (left + tw > window.innerWidth - 8) left = window.innerWidth - tw - 8;
  if (left < 8) left = 8;
  tip.style.top = tTop + 'px'; tip.style.left = left + 'px';
  tip.style.visibility = 'visible';
}

function _tourKey(e) {
  if (e.key === 'Escape') _tourEnd();
  else if (e.key === 'ArrowRight') _tourGo(_tourIndex + 1, 1);
  else if (e.key === 'ArrowLeft')  _tourGo(_tourIndex - 1, -1);
}
let _tourRT;
function _tourResize() {
  clearTimeout(_tourRT);
  _tourRT = setTimeout(() => {
    if (!_tourEls) return;
    const el = TOUR_STEPS[_tourIndex] && TOUR_STEPS[_tourIndex].sel();
    if (el) _tourPlace(el, _tourIndex);
  }, 120);
}
function _tourEnd() {
  if (_tourEls) { _tourEls.root.remove(); _tourEls = null; }
  document.removeEventListener('keydown', _tourKey);
  window.removeEventListener('resize', _tourResize);
}
window.__startTour = function () {
  if (_tourEls) return;
  const root = document.createElement('div');
  root.id = 'tour-root';
  root.innerHTML =
    '<div class="tour-blocker"></div>' +
    '<div class="tour-spot"></div>' +
    '<div class="tour-tip">' +
      '<button class="tour-x" aria-label="Close tour">\u00d7</button>' +
      '<p class="tour-text"></p>' +
      '<div class="tour-foot"><span class="tour-dots">' +
        TOUR_STEPS.map(() => '<i class="tour-dot"></i>').join('') +
      '</span><span class="tour-btns">' +
        '<button class="tour-skip">Skip</button>' +
        '<button class="tour-back">Back</button>' +
        '<button class="tour-next">Next</button>' +
      '</span></div>' +
    '</div>';
  document.body.appendChild(root);
  _tourEls = { root, spot: root.querySelector('.tour-spot'), tip: root.querySelector('.tour-tip') };
  root.querySelector('.tour-x').onclick    = _tourEnd;
  root.querySelector('.tour-skip').onclick = _tourEnd;
  root.querySelector('.tour-back').onclick = () => _tourGo(_tourIndex - 1, -1);
  root.querySelector('.tour-next').onclick = () => _tourGo(_tourIndex + 1, 1);
  document.addEventListener('keydown', _tourKey);
  window.addEventListener('resize', _tourResize);
  _tourFirst = true;
  _tourGo(0, 1);
};
(function () {
  setTimeout(() => window.__startTour(), 500);
})();

})();
</script>
</body>
